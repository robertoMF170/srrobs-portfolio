<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versão Família — SrRobs</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>

:root{--black:#070707;--black2:#111;--white:#F4F4F2;--muted:#9A9A9A;--red:#E30613;--red2:#FF1A1A;--line:#1A1A1A;--line2:#2A2A2A;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:'JetBrains Mono',monospace;line-height:1.65;-webkit-font-smoothing:antialiased;font-size:13.5px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1.12}
h1 em,h2 em,h3 em{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;color:var(--red);letter-spacing:0}
a{color:var(--red2);text-decoration:none}
a:hover{color:#fff}
::selection{background:var(--red);color:#fff}
.topo{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:14px 22px;background:rgba(7,7,7,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.marca b{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.03em;color:#fff}
.marca .dot{color:var(--red)}
.marca .meta{font-size:9.5px;letter-spacing:.14em;color:#666;text-transform:uppercase}
.topo a{font-size:10px;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line2);padding:8px 12px;transition:.22s var(--ease);text-transform:uppercase}
.topo a:hover{background:var(--red);border-color:var(--red);color:#fff}
.gate{max-width:480px;margin:9vh 20px;background:var(--black2);border:1px solid var(--line);padding:34px 30px;position:relative}
.gate::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--red)}
.gate .sub{font-size:10px;letter-spacing:.16em;color:#666;text-transform:uppercase;margin-bottom:14px}
.gate h1{font-size:28px;margin-bottom:12px}
.gate p{font-size:12.5px;color:var(--muted);margin-bottom:20px}
.gate strong{color:#fff}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#888;margin-bottom:8px}
input{width:100%;padding:13px 14px;background:var(--black);border:1px solid var(--line2);color:#fff;font:inherit;font-size:13px}
input:focus{outline:none;border-color:var(--red)}
button{width:100%;margin-top:16px;padding:14px;background:var(--red);color:#fff;border:1px solid var(--red);font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.14em;cursor:pointer;transition:.22s var(--ease)}
button:hover{background:var(--black);color:#fff}
.erro{color:var(--red2);font-size:10.5px;letter-spacing:.08em;margin-top:12px;min-height:1.2em;text-transform:uppercase}
.nota{font-size:9px;letter-spacing:.12em;color:#555;margin-top:18px;text-align:center;line-height:2}
.deck{max-width:920px;margin:0 auto;padding:48px 22px 64px}
.capa{text-align:center;padding:64px 16px 48px;border:1px solid var(--line);margin-bottom:34px;position:relative}
.capa::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--red)}
.capa .etiqueta{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:800;margin-bottom:18px}
.capa h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.05em;margin-bottom:14px}
.capa .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.capa .aviso{margin-top:26px;font-size:10px;letter-spacing:.12em;color:#666;text-transform:uppercase;border-top:1px solid var(--line);padding-top:18px;display:inline-block}
.slide{background:var(--black);border:1px solid var(--line);padding:clamp(22px,4vw,34px);margin-bottom:16px;position:relative;overflow:hidden;transition:transform .4s var(--ease),border-color .3s}
.slide:hover{transform:translateY(-2px);border-color:var(--line2)}
.slide::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.slide:hover::before{transform:scaleX(1)}
.slide .num{display:inline-block;font-size:9px;letter-spacing:.18em;font-weight:800;background:var(--red);color:#fff;padding:5px 10px;margin-bottom:16px;text-transform:uppercase}
.slide h2{font-size:clamp(20px,3vw,26px);margin-bottom:14px}
.slide p{color:var(--muted);margin-bottom:10px}
.slide ul,.slide ol{margin:6px 0 14px 18px}
.slide li{color:var(--muted);margin-bottom:7px}
.slide li strong,.slide p strong{color:#fff}
blockquote{border-left:3px solid var(--red);padding:8px 0 8px 20px;font-family:'Instrument Serif',serif;font-style:italic;font-size:21px;color:#fff;line-height:1.5;margin:16px 0}
.destaque{background:var(--black2);border:1px solid var(--line2);padding:22px 24px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:19px;letter-spacing:-.02em;color:#fff;margin:16px 0}
.destaque .sub{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:#666;text-transform:uppercase;margin-top:8px}
.checks{list-style:none!important;margin-left:0!important}
.checks li{padding-left:26px;position:relative}
.checks li::before{content:"//";position:absolute;left:0;color:var(--red);font-weight:800}
.tabela{width:100%;border-collapse:collapse;font-size:11.5px;margin:18px 0;font-variant-numeric:tabular-nums}
.tabela th{background:var(--black2);color:#fff;text-align:left;padding:11px 14px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--red)}
.tabela td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
.tabela td:first-child{color:#fff}
.tabela tr:hover td{background:#0C0C0C}
.tabela .fim td{color:#fff;background:#0F0F0F}
.tabela .total td{background:var(--red);color:#fff;border-bottom:0}
.notas{background:var(--black2);border:1px solid var(--line);border-left:3px solid var(--red);padding:14px 18px;font-size:11.5px;color:var(--muted);margin-top:16px}
.notas b{color:#fff;letter-spacing:.1em;font-size:9.5px;text-transform:uppercase;display:block;margin-bottom:6px}
.resumo{background:var(--black2);border:1px dashed var(--line2);padding:20px 22px;font-size:12px;color:var(--muted);line-height:1.8}
details{border:1px solid var(--line);background:var(--black);padding:14px 18px;margin-bottom:10px;transition:border-color .3s}
details[open]{border-color:var(--line2)}
details summary{cursor:pointer;font-weight:700;color:#fff;font-size:12px}
details p{margin:10px 0 2px;font-size:11.5px;color:var(--muted)}
.rodape-deck{border-top:1px solid var(--line);margin-top:36px;padding-top:26px;text-align:center}
.rodape-deck p{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#666;line-height:2}
.rodape-deck a{color:var(--red2)}
.rodape-deck .fino{color:#444;font-size:9px}
@media(max-width:640px){body{font-size:12.5px}.deck{padding:32px 14px 48px}.capa h1{font-size:30px}.tabela{font-size:10px}.tabela th,.tabela td{padding:8px 9px}}

</style>
</head>

const form = document.getElementById('form');
form.addEventListener('submit', async function (ev) {
  ev.preventDefault();
  const pw = document.getElementById('pw').value;
  const erro = document.getElementById('erro');
  try {
    const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: dec(PAYLOAD.s), iterations: 100000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(PAYLOAD.i) }, chave, dec(PAYLOAD.d));
    document.getElementById('palco').innerHTML = new TextDecoder().decode(claro);
    document.getElementById('palco').hidden = false;
    document.getElementById('gate').style.display = 'none';
    window.scrollTo(0, 0);
  } catch (e) {
    erro.textContent = 'PALAVRA-PASSE INCORRETA. TENTA OUTRA VEZ.';
    document.getElementById('pw').value = '';
